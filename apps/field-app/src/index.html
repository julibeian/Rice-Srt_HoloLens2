<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'self' blob: mediastream:; object-src 'none'">
<title>稻视界 · 动态检测</title><link rel="stylesheet" href="shell.css">
<script src="boot.js"></script><script src="camera-controls.js" defer></script><script src="dynamic.js" defer></script><script src="native.js" defer></script><script src="app.js" defer></script></head>
